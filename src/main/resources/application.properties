spring.application.name=gestion-gastos

# BBDD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.main.banner-mode=off

# LOGS
logging.file.name=logs/gestion-gastos.log
logging.level.root=INFO
logging.level.com.nexzus.gestiongastos=DEBUG

# JWT
jwt.secret=${JWT_SECRET}
jwt.accessTokenExpirationMs=${JWT_ACCESS_TOKEN_EXPIRATION_MS}
jwt.refreshTokenExpirationMs=${JWT_REFRESH_TOKEN_EXPIRATION_MS}

# GOOGLE
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}